# The checks that have to pass before anything lands on `main`.
#
# `icons:ci` is the real gate and it is a chain, not a suite: `build --check`
# proves icons/ still matches raw/, `build-react --check` proves
# components/icons/index.tsx still matches icons/stroke/, and `tsc` then checks
# the app against that module. Run them out of order and a stale generated file
# type-checks clean against a set that no longer backs it.
#
# Deliberately absent: `icons:figma` needs the Figma file, and `brand:check`
# rasterises through headless Chrome, so two Chrome versions disagree by a pixel
# on identical input and the job fails for reasons that are not the mark. Both
# are documented in pipeline/README.md as run-them-locally checks.
name: CI

# Every pushed branch, not only `main`. With `main` alone a release branch had
# no CI until it had merged, and 6 of the first 9 red runs were found on `main`
# that way, all at `pnpm icons:ci`. Not `release/**` either: `main` has taken
# merges from fix/, blog/ and paper/ branches too. `"**"` rather than no filter
# at all, because an unfiltered push also fires on tags, and a tag names a
# commit its branch has already checked.
on:
  push:
    branches: ["**"]
  pull_request:

# A newer push to the same branch or PR makes the older run irrelevant, so
# cancel it. Since every branch runs on push, that covers release branches as
# well as PRs. A branch with an open PR still runs once per event, and both are
# worth having: the push checks the branch, the PR checks its merge with `main`.
# `main` is excluded from cancellation: those runs are the record of what the
# branch looked like when each commit landed.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

permissions:
  contents: read

jobs:
  # One job per command, on three runners at once, so the run takes as long as
  # the slowest of them rather than the sum. In one job they ran in a row: 157s,
  # 212s and 100s on the release/2.5.0 push of 2 Nov 2026, 8.1 minutes of job
  # for three commands that share nothing but the install. Each runner installs
  # on its own, which costs about 15 seconds against the minutes it saves.
  #
  # A matrix rather than three jobs written out, so the setup below exists once
  # and a fourth command is one line. `fail-fast: false` because the three
  # answer different questions: a lint error is no reason to cancel the build
  # that would have reported a second, unrelated failure in the same push.
  check:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        command: [icons:ci, lint, build]
    # All three actions are on v5, the first major of each that runs on Node 24;
    # every earlier one runs on Node 20 and warns on every run. None of the
    # three renamed an input between v4 and v5.
    steps:
      - uses: actions/checkout@v5

      # Before setup-node, so its `cache: pnpm` has a pnpm to ask for a store
      # path. The other order fails with "Unable to locate executable file: pnpm".
      #
      # v5, not v6: v6 installs a pnpm 11 starter build first, and
      # pnpm/action-setup#225 reports `version: 10` ending up on pnpm 11.
      - uses: pnpm/action-setup@v5
        with:
          version: 10

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm

      # --frozen-lockfile so a lockfile that disagrees with package.json fails
      # here rather than being silently resolved into something no one tested.
      # The skills under `.claude/skills/` are private and are not published
      # with this repository. `.gitignore` states that and a comment cannot
      # enforce it: an `--force` add, a merge, or a rewrite that predates the
      # rule would all put them back silently. This turns the policy into a
      # failing build. It runs before anything slow, so the answer arrives in
      # seconds rather than after a full install and build.
      - name: Skills must never be committed
        run: |
          if git ls-files --error-unmatch .claude/skills > /dev/null 2>&1; then
            echo "::error::Private skills are tracked. See the .claude/skills rule in .gitignore."
            git ls-files .claude/skills
            exit 1
          fi
          echo "No skills tracked."

      - run: pnpm install --frozen-lockfile

      # `icons:ci` runs `next typegen` itself, and has to. `next-env.d.ts` is
      # gitignored, so it never exists on a fresh checkout, and it is the file
      # that pulls in `next/image-types/global`, the declaration for `*.png`
      # imports. Without it `tsc` fails with "Cannot find module
      # '@/public/mockups/figma.png'" about a file that is committed and
      # present.
      #
      # Locally it is invisible: `next dev` writes the file once and it stays,
      # so the first CI run is the first honest test of a clean checkout. It
      # was, and this is what it caught. Putting the fix in the script rather
      # than in a step here keeps `pnpm icons:ci` the same check locally as on
      # GitHub. CONTRIBUTING says CI runs it, `pnpm lint` and `pnpm build`, the
      # three commands in the matrix: pass all three locally, pass here.
      - run: pnpm ${{ matrix.command }}

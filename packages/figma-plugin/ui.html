<!--
  The plugin's UI: search on the left of the sandbox boundary, document on the
  right. Everything visible happens here.

  No build step and no dependencies. Figma loads this file as-is through
  `__html__`, so a bundler would only exist to inline what is already inline,
  and the whole surface is a search box, a style switch and a grid.
-->
<meta charset="utf-8" />
<!--
  Declared rather than inherited. This file holds three non-ASCII characters:
  the ellipsis in "Loading the set…" and the curly quotes around a failed query.
  Without a charset the host decides, and a host that does not say UTF-8 renders
  the first of those as mojibake on the plugin's opening frame. Found by serving
  this file over a plain static server, where it read "Loading the setâ€¦".
-->
<style>
  :root {
    color-scheme: light dark;
    --bg: var(--figma-color-bg, #fff);
    --text: var(--figma-color-text, #000);
    --dim: var(--figma-color-text-secondary, #7a7a7a);
    --hover: var(--figma-color-bg-hover, #f2f2f2);
    --line: var(--figma-color-border, #e6e6e6);
    --sel: var(--figma-color-bg-selected, #e5f4ff);
  }

  * { box-sizing: border-box; }

  body {
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font: 11px/1.4 Inter, ui-sans-serif, system-ui, sans-serif;
    display: flex;
    flex-direction: column;
    height: 100vh;
  }

  header {
    position: sticky;
    top: 0;
    padding: 8px 8px 6px;
    background: var(--bg);
    border-bottom: 1px solid var(--line);
  }

  input {
    width: 100%;
    padding: 7px 8px;
    border: 1px solid var(--line);
    border-radius: 5px;
    background: transparent;
    color: inherit;
    font: inherit;
    outline: none;
  }
  input:focus { border-color: var(--figma-color-border-selected, #0d99ff); }

  .styles { display: flex; gap: 2px; margin-top: 6px; }
  .styles button {
    flex: 1;
    padding: 5px 0;
    border: 0;
    border-radius: 4px;
    background: transparent;
    color: var(--dim);
    font: inherit;
    text-transform: capitalize;
    cursor: pointer;
  }
  .styles button:hover { background: var(--hover); }
  .styles button[aria-pressed="true"] { background: var(--sel); color: var(--text); }

  main { flex: 1; overflow-y: auto; padding: 8px; }

  .grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(40px, 1fr));
    gap: 2px;
  }

  /* The icons paint with `currentColor`, so the tile's colour is the icon's. */
  .grid button {
    aspect-ratio: 1;
    display: grid;
    place-items: center;
    border: 0;
    border-radius: 5px;
    background: transparent;
    color: var(--text);
    cursor: pointer;
    padding: 0;
  }
  .grid button:hover { background: var(--hover); }
  .grid svg { width: 24px; height: 24px; display: block; }

  .note { color: var(--dim); padding: 6px 2px; }
  footer {
    padding: 6px 8px;
    border-top: 1px solid var(--line);
    color: var(--dim);
    display: flex;
    justify-content: space-between;
  }
  a { color: inherit; }
</style>

<header>
  <input id="q" type="search" placeholder="Search icons" autocomplete="off" autofocus />
  <div class="styles" id="styles"></div>
  <div class="styles" id="corners"></div>
</header>

<main>
  <div class="note" id="note">Loading the set…</div>
  <div class="grid" id="grid"></div>
</main>

<footer>
  <span id="count"></span>
  <a href="https://keylineicons.com" target="_blank" rel="noreferrer">keylineicons.com</a>
</footer>

<script>
  // Fetched rather than bundled, so shipping icons does not mean shipping a
  // plugin. A plugin update goes through Figma review; a `main` push reaches
  // jsDelivr on its own, and this file is generated by pipeline/build-data.mjs
  // and committed for exactly that reason.
  //
  // jsDelivr caches a branch URL for around 12 hours, which is the price of not
  // republishing. Pin a tag here instead if a release should land the moment it
  // is cut.
  const DATA_URL =
    "https://cdn.jsdelivr.net/gh/keyline-icons/keyline-icons@main/packages/figma-plugin/icons.json"

  const $ = (id) => document.getElementById(id)
  const grid = $("grid")
  const note = $("note")

  let ICONS = {}
  let KEYWORDS = {}
  let NAMES = []
  let style = "stroke"
  /*
    Rounded until asked otherwise, which is what every caller of the set
    defaults to: someone who has never heard of the axis gets the drawing they
    have always got. The row below only appears if the data offers the axis, so
    a stale cached bundle degrades to the plugin this was before.
  */
  let corners = "regular"

  /* ------------------------------------------------------------------ data */

  async function load() {
    try {
      /*
        Revalidate, then fall back to whatever is cached.

        jsDelivr answers with `max-age=604800`, so a plain fetch is served from
        this browser's own cache for a week without asking. That is why the panel
        still loads with the network off, which is worth having. It also meant a
        new icon release reached nobody who had already run the plugin until
        their cache expired: seven days, not the twelve hours the edge cache
        costs.

        `no-cache` keeps the stored copy but always asks the server whether it
        changed, so an unchanged set comes back as a 304 and costs nothing. When
        that ask cannot happen, `force-cache` takes the stored copy however stale
        it is, which is the offline case and the only one where stale is better
        than nothing.
      */
      let res
      try {
        res = await fetch(DATA_URL, { cache: "no-cache" })
      } catch (offline) {
        res = await fetch(DATA_URL, { cache: "force-cache" })
      }
      if (!res.ok) throw new Error(`HTTP ${res.status}`)
      const data = await res.json()

      ICONS = data.icons
      KEYWORDS = data.keywords || {}
      NAMES = Object.keys(ICONS)

      renderStyles(data.styles)
      renderCorners(data.corners)
      render()
    } catch (err) {
      note.textContent = `Could not load the icon set (${err.message}). `
      const retry = document.createElement("a")
      retry.href = "#"
      retry.textContent = "Try again"
      retry.onclick = (e) => {
        e.preventDefault()
        note.textContent = "Loading the set…"
        load()
      }
      note.append(retry)
    }
  }

  /* ---------------------------------------------------------------- search */

  /**
   * Keywords are keyed by base name: one component set in Figma covers all three
   * containers, so `square-arrow-down` is described by `arrow-down` or by
   * nothing. The prefix only counts when that base actually exists, because
   * `circle-half` and `square-dashed` are shapes in their own right and there is
   * no `half` for them to be a container around.
   */
  function keywordsFor(name) {
    const m = /^(square|circle)-(.+)$/.exec(name)
    return KEYWORDS[m && ICONS[m[2]] ? m[2] : name] || []
  }

  const haystackFor = (name) => `${name} ${keywordsFor(name).join(" ")}`

  /**
   * A word reduced to its singular, so a plural finds the family.
   *
   * Every name in the set is singular: `arrow-down`, `file`, `bar-chart`. Every
   * heading on the site's category rail is plural. So "Arrows" sat on the screen
   * while typing `arrows` returned one drawing out of 585, `git-compare-arrows`,
   * the only name carrying the letter. `charts`, `stars` and `bells` returned
   * nothing at all. The plural is what someone reads off our own sidebar and
   * what every other set answers, and here it was the one word that could not
   * work.
   *
   * Applied to both sides, the query word and each word of the haystack, which
   * also carries the other direction: `chevron` reaches `chevrons-left`, which
   * whole words alone could not.
   *
   * Deliberately blunt: no dictionary, no suffix ladder, one `s`. The guards are
   * the whole design, and they are read off this vocabulary rather than guessed.
   * Every `-ss`, `-us` and `-is` word in it is already a word: `progress`,
   * `compass`, `plus`, `minus`, `status`, `axis`. Past those, `lens`, `atlas`
   * and `sideways` are the only three that end in `s` without being a plural.
   * `lens` is the one that mattered. Cut to `len` it lands inside `calendar` and
   * `silence`, and the word someone types for the camera came back with
   * seventeen drawings that are not it.
   *
   * `arrows` is in the list for the opposite reason. The rule would not damage
   * it, it would erase it: the plural asks for the drawings carrying more than
   * one arrowhead, `fullscreen`, `chevrons-up-down`, `refresh-cw`, and folding it
   * into `arrow` answers with the ninety-nine single arrows instead. The word is
   * a keyword on those drawings, in lib/icon-aliases.json, and this is what keeps
   * the two questions apart.
   *
   * Same rule as the site, the MCP server and the CLI, checked by
   * pipeline/check-search.mjs.
   */
  const singular = (w) =>
    w.length < 4 ||
    !w.endsWith("s") ||
    /(ss|us|is|arrows|lens|atlas|sideways)$/.test(w)
      ? w
      : w.endsWith("ies")
        ? `${w.slice(0, -3)}y`
        : /(ch|sh|x|z)es$/.test(w)
          ? w.slice(0, -2)
          : w.slice(0, -1)

  /** Every word in `hay` singular, delimiters kept so the words stay separate. */
  const stemmed = (hay) => hay.replace(/[a-z0-9]+/g, singular)

  /**
   * A word that answers only to itself, never to a piece of itself.
   *
   * The panel matches substrings, because someone typing `arro` has not
   * finished the word yet, and that is what would hand `arrows` to `arrow` too.
   * The plural is a different question, so the token is cut out of the haystack
   * unless the query asked for it whole.
   *
   * Same rule as the site, the other surface that matches substrings.
   */
  const CONCEPTS = /(^|[ -])(arrows)(?=$|[ -])/g

  /** Whether one haystack answers every word of a query. */
  const answers = (haystack, words) => {
    const hay = haystack.replace(CONCEPTS, (m, lead, word) =>
      words.includes(word) ? m : lead
    )
    const stem = stemmed(hay)
    return words.every((w) => hay.includes(w) || stem.includes(singular(w)))
  }

  /**
   * The query as words, matching `packages/mcp/src/index.mjs`.
   *
   * A query carrying a camelCase boundary is a component identifier someone
   * pasted out of their code rather than a phrase they typed, `CheckCircle2` or
   * `RefreshCw`, so it is split on those boundaries and a leftover bare digit is
   * dropped: lucide's trailing `2` disambiguates inside lucide and means nothing
   * here. Two shapes count: a camelCase boundary, and a single capitalised word
   * ending in digits, which is what `Share2` is and what this missed.
   *
   * Still guarded, because `clock-3`, `dice-5` and `bar-chart-2` are real names
   * and a lowercase query keeps its digits.
   */
  function wordsOf(query) {
    const identifier =
      /[a-z][A-Z]/.test(query) || /^[A-Z][A-Za-z]*\d+$/.test(query)
    const split = identifier
      ? query.replace(/([a-z0-9])([A-Z])/g, "$1 $2").replace(/([a-zA-Z])(\d)/g, "$1 $2")
      : query
    return split
      .toLowerCase()
      .split(/[^a-z0-9]+/)
      .filter((w) => w && !(identifier && /^\d+$/.test(w)))
  }

  /**
   * Same tiers as the MCP server and the CLI, with keyword hits last: an exact
   * name beats a prefix beats a word start beats a substring, then every word
   * landing somewhere, then a word someone curated in Figma. Ties break on the
   * shorter name, which is what keeps `arrow-down` above
   * `arrow-down-narrow-wide`.
   *
   * The word tier is why this is not just `indexOf`. Compounds here read
   * base-first, so a designer carrying lucide's `CheckCircle2` types
   * "check-circle", and matching the whole string finds nothing even though
   * `circle-check` is right there. This plugin shipped with that bug after the
   * MCP server and the CLI were fixed for it, because nothing checks that the
   * four searches agree.
   */
  function search(q, raw) {
    // Browsing, not searching. The ranked order below breaks ties on length,
    // which is right for a query and reads as random with nothing typed: it
    // opens on `x`, `at`, `bin`. Alphabetical is the only useful browse order.
    if (!q) return NAMES.filter((n) => artOf(n)).map((name) => ({ name }))

    const words = wordsOf(raw ?? q)
    const hits = []
    for (const name of NAMES) {
      if (!artOf(name)) continue
      const i = name.indexOf(q)
      if (i !== -1) {
        const boundary = /(^|-)/.test(name[i - 1] ?? "-")
        hits.push({ name, rank: name === q ? 0 : i === 0 ? 1 : boundary ? 2 : 3 })
      } else if (words.length && answers(name, words)) {
        hits.push({ name, rank: 4 })
      } else if (words.length && answers(haystackFor(name), words)) {
        hits.push({ name, rank: 5 })
      }
    }
    return hits.sort(
      (a, b) => a.rank - b.rank || a.name.length - b.name.length || a.name.localeCompare(b.name)
    )
  }

  /**
   * Names a query matches in some other style, so a gap reads as coverage, not
   * as a bug. Matched the same way as `search`, or the count would disagree with
   * the grid it is explaining.
   */
  const elsewhere = (q, raw) => {
    const words = wordsOf(raw ?? q)
    return NAMES.filter(
      (n) =>
        !artOf(n) &&
        (n.includes(q) ||
          (words.length &&
            (answers(n, words) || answers(haystackFor(n), words))))
    ).length
  }

  /* ---------------------------------------------------------------- render */

  /**
   * One drawing, by name, style and treatment.
   *
   * The bundle nests rather than spreads — `icons[name][style]` is still the
   * rounded drawing and `icons[name].sharp[style]` is its squared twin — so
   * every existing lookup went on meaning what it meant and this is the only
   * place that has to know the axis exists. Five call sites used to index the
   * bundle directly; they all come through here now, because a treatment that
   * four of them honour and the fifth does not is a grid that draws one thing
   * and inserts another.
   */
  const artOf = (name) => {
    const icon = ICONS[name]
    if (!icon) return undefined
    return corners === "sharp" ? icon.sharp && icon.sharp[style] : icon[style]
  }

  function svgFor(name) {
    const art = artOf(name)
    const attrs = Object.entries(art.root)
      .map(([k, v]) => ` ${k}="${v}"`)
      .join("")
    return (
      `<svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" ` +
      `viewBox="0 0 24 24"${attrs}>${art.body}</svg>`
    )
  }

  function renderStyles(styles) {
    $("styles").innerHTML = styles
      .map((s) => `<button data-style="${s}" aria-pressed="${s === style}">${s}</button>`)
      .join("")
  }

  /*
    Read off the bundle rather than written here, exactly as the styles are, so
    a treatment added later needs no plugin update to appear — which is the
    whole point of fetching the set instead of shipping it. A bundle that
    predates the axis offers nothing and the row stays empty, so an offline
    copy from before this release still works.

    "Rounded" rather than "regular": the property is called `regular` in Figma
    to leave room for a third treatment, and the word a designer reads should
    say what the corner does.
  */
  function renderCorners(list) {
    const row = $("corners")
    if (!list || list.length < 2) {
      row.style.display = "none"
      return
    }
    row.innerHTML = list
      .map(
        (c) =>
          `<button data-corners="${c}" aria-pressed="${c === corners}">` +
          `${c === "regular" ? "rounded" : c}</button>`
      )
      .join("")
  }

  function render() {
    // Both forms. The lowercased one is what the substring tiers match on; the
    // raw one still carries the case boundary that tells `wordsOf` it is looking
    // at a pasted identifier rather than a typed phrase.
    const raw = $("q").value.trim()
    const q = raw.toLowerCase()
    const hits = search(q, raw)

    // One write, not one per icon. The whole set is under 500 names, so the grid
    // is built as a string and handed over in a single assignment.
    grid.innerHTML = hits
      .map((h) => `<button data-name="${h.name}" title="${h.name}">${svgFor(h.name)}</button>`)
      .join("")

    /*
      Four states, and the empty one is the reason this exists. Duotone and fill
      need a region to fill and some glyphs have none, so an empty grid is
      usually coverage rather than a failure, and saying only "nothing matches"
      reads as "we do not have this icon" when we do.

      This used to surface the count only when the grid already had hits, which
      is the case that needs it least. Searching `wifi` in fill showed
      "Nothing matches" while six wifi icons sat one tab away.
    */
    const missing = q ? elsewhere(q, raw) : 0
    note.textContent = hits.length
      ? missing
        ? `${missing} more match in another style.`
        : ""
      : missing
        ? `Nothing in ${style}. ${missing} match in another style.`
        : `Nothing matches “${q}”.`
    note.style.display = note.textContent ? "block" : "none"

    $("count").textContent =
      `${hits.length} ${style}` + (corners === "sharp" ? " sharp" : "")

    for (const b of $("styles").children) {
      b.setAttribute("aria-pressed", String(b.dataset.style === style))
    }
    for (const b of $("corners").children) {
      b.setAttribute("aria-pressed", String(b.dataset.corners === corners))
    }
  }

  /* ---------------------------------------------------------------- events */

  $("q").oninput = render

  $("styles").onclick = (e) => {
    const b = e.target.closest("button")
    if (!b) return
    style = b.dataset.style
    render()
  }

  $("corners").onclick = (e) => {
    const b = e.target.closest("button")
    if (!b) return
    corners = b.dataset.corners
    render()
  }

  grid.onclick = (e) => {
    const b = e.target.closest("button")
    if (!b) return
    const name = b.dataset.name
    parent.postMessage({ pluginMessage: { type: "insert", name, svg: svgFor(name) } }, "*")
  }

  load()
</script>
